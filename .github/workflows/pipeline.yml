name: CI/CD - Pruebas, Docker y EC2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  # =====================================================
  # PRUEBAS BACKEND - JEST
  # =====================================================

  backend-tests:

    name: Backend - Jest

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas backend
        run: npm test


  # =====================================================
  # PRUEBAS FRONTEND - PLAYWRIGHT
  # =====================================================

  frontend-tests:

    name: Frontend - Playwright

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas Playwright
        run: npm run test:e2e
        env:
          CI: true

      - name: Guardar reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


  # =====================================================
  # REGISTRAR RESULTADO DE PRUEBAS EN OPENOBSERVE
  # SE EJECUTA AUNQUE ALGUNA PRUEBA FALLE
  # =====================================================

  report-tests:

    name: OpenObserve - Resultado de pruebas

    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-tests

    if: ${{ always() }}

    steps:

      - name: Determinar resultado
        id: resultado
        run: |
          if [ "${{ needs.backend-tests.result }}" = "success" ] && \
             [ "${{ needs.frontend-tests.result }}" = "success" ]; then

            echo "estado=success" >> "$GITHUB_OUTPUT"

          else

            echo "estado=failure" >> "$GITHUB_OUTPUT"

          fi


      - name: Registrar pruebas en OpenObserve
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}

          RESULTADO: ${{ steps.resultado.outputs.estado }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}

          COMMIT_SHA: ${{ github.sha }}
          RAMA: ${{ github.ref_name }}
          USUARIO: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD=$(jq -n \
            --arg evento "PIPELINE_TESTS" \
            --arg resultado "$RESULTADO" \
            --arg backend "$BACKEND_RESULT" \
            --arg frontend "$FRONTEND_RESULT" \
            --arg commit "$COMMIT_SHA" \
            --arg rama "$RAMA" \
            --arg usuario "$USUARIO" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg timestamp "$TIMESTAMP" \
            '[
              {
                evento: $evento,
                resultado: $resultado,
                backend: $backend,
                frontend: $frontend,
                commit: $commit,
                rama: $rama,
                usuario: $usuario,
                run_id: $run_id,
                run_number: $run_number,
                timestamp: $timestamp
              }
            ]'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            -u "$OPENOBSERVE_USER:$OPENOBSERVE_PASSWORD" \
            -H "Content-Type: application/json" \
            -X POST \
            "$OPENOBSERVE_URL/api/default/cicd/_json" \
            -d "$PAYLOAD"

          echo ""
          echo "Resultado de pruebas registrado en OpenObserve"


  # =====================================================
  # CONSTRUIR IMAGEN DOCKER
  # SOLO SI JEST Y PLAYWRIGHT PASARON
  # =====================================================

  docker-build:

    name: Docker - Build

    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-tests

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: |
          docker build \
            -t devops-tasks:${{ github.sha }} \
            .


  # =====================================================
  # DESPLIEGUE AUTOMATICO A AWS EC2
  # SOLO SI LAS PRUEBAS Y DOCKER FUERON CORRECTOS
  # =====================================================

  deploy:

    name: Deploy - AWS EC2

    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Configurar clave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      - name: Desplegar aplicacion en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            set -e

            echo "======================================"
            echo "INICIANDO DESPLIEGUE EN AWS EC2"
            echo "======================================"

            cd ~/parcial2-devops-observability

            git pull origin main

            docker compose up -d --build devops-tasks

            sleep 5

            curl --fail http://localhost:3000/api/health

            echo ""
            echo "======================================"
            echo "DESPLIEGUE COMPLETADO CORRECTAMENTE"
            echo "======================================"

          EOF


      # =================================================
      # REGISTRAR RESULTADO DEL DEPLOY EN OPENOBSERVE
      # =================================================

      - name: Registrar despliegue en OpenObserve
        if: ${{ always() }}

        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}

          DEPLOY_RESULT: ${{ job.status }}

          COMMIT_SHA: ${{ github.sha }}
          RAMA: ${{ github.ref_name }}
          USUARIO: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD=$(jq -n \
            --arg evento "DEPLOY_EC2" \
            --arg resultado "$DEPLOY_RESULT" \
            --arg commit "$COMMIT_SHA" \
            --arg rama "$RAMA" \
            --arg usuario "$USUARIO" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg timestamp "$TIMESTAMP" \
            '[
              {
                evento: $evento,
                resultado: $resultado,
                destino: "AWS EC2",
                commit: $commit,
                rama: $rama,
                usuario: $usuario,
                run_id: $run_id,
                run_number: $run_number,
                timestamp: $timestamp
              }
            ]'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            -u "$OPENOBSERVE_USER:$OPENOBSERVE_PASSWORD" \
            -H "Content-Type: application/json" \
            -X POST \
            "$OPENOBSERVE_URL/api/default/cicd/_json" \
            -d "$PAYLOAD"

          echo ""
          echo "Resultado del despliegue registrado en OpenObserve"