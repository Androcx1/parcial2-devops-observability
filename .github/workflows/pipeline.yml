name: CI/CD - Tests, Docker y EC2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  # =====================================================
  # PRUEBAS BACKEND - JEST / SUPERTEST
  # =====================================================

  backend-tests:

    name: Backend - Jest

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas backend
        run: npm test


  # =====================================================
  # PRUEBAS FRONTEND - PLAYWRIGHT
  # =====================================================

  frontend-tests:

    name: Frontend - Playwright

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas Playwright
        run: npm run test:e2e
        env:
          CI: true

      - name: Guardar reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


  # =====================================================
  # CONSTRUIR IMAGEN DOCKER
  # SOLO SI JEST Y PLAYWRIGHT PASARON
  # =====================================================

  docker-build:

    name: Docker - Build

    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-tests

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: |
          docker build \
            -t devops-tasks:${{ github.sha }} \
            .


  # =====================================================
  # DESPLIEGUE AUTOMATICO A AWS EC2
  # SOLO DESPUES DE PRUEBAS + DOCKER CORRECTOS
  # SOLO EN PUSH A MAIN
  # =====================================================

  deploy:

    name: Deploy - AWS EC2

    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Configurar clave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      - name: Desplegar aplicacion en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            set -e

            echo "======================================"
            echo "INICIANDO DESPLIEGUE EN AWS EC2"
            echo "======================================"

            cd ~/parcial2-devops-observability

            echo "Actualizando repositorio..."
            git pull origin main

            echo "Reconstruyendo aplicacion..."
            docker compose up -d --build devops-tasks

            echo "Contenedores activos:"
            docker ps

            echo "Comprobando API..."
            sleep 5

            curl --fail http://localhost:3000/api/health

            echo ""
            echo "======================================"
            echo "DESPLIEGUE COMPLETADO CORRECTAMENTE"
            echo "======================================"

          EOF