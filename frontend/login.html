<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | DevOps Tasks</title>

  <link
    rel="stylesheet"
    href="/css/styles.css"
  >
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <h1>DevOps Tasks</h1>

      <p class="login-description">
        Sistema CI/CD y Observabilidad
      </p>

      <h2>Iniciar sesión</h2>

      <form id="login-form">

        <div class="form-group">

          <label for="username">
            Usuario
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
          >

        </div>


        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          >

        </div>


        <button
          id="login-button"
          type="submit"
          class="login-button"
        >
          Iniciar sesión
        </button>

      </form>


      <p
        id="login-message"
        class="message"
      ></p>


      <div class="credentials">

        <strong>
          Credenciales de prueba
        </strong>

        <p>
          Usuario: admin
        </p>

        <p>
          Contraseña: Admin123!
        </p>

      </div>

    </section>

  </main>


  <script src="/js/login.js"></script>

</body>

</html>
