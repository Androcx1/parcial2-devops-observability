services:

  devops-tasks:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: devops-tasks-app

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000

      # ================================================
      # OPENOBSERVE - LOGS DE LA APLICACION
      # ================================================
      - OPENOBSERVE_URL=http://openobserve:5080
      - OPENOBSERVE_ORG=default
      - OPENOBSERVE_STREAM=devops_tasks
      - OPENOBSERVE_USER=${OPENOBSERVE_USER}
      - OPENOBSERVE_PASSWORD=${OPENOBSERVE_PASSWORD}

      # ================================================
      # OPENTELEMETRY - TRAZAS
      # ================================================
      - OTEL_SERVICE_NAME=devops-tasks-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production

      # Cargar autoinstrumentacion antes de server.js
      - NODE_OPTIONS=--require=@opentelemetry/auto-instrumentations-node/register

    volumes:
      - tasks-data:/app/backend/db

    restart: unless-stopped


volumes:
  tasks-data: